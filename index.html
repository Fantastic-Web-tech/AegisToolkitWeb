<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AegisToolkit Web - Secure Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container py-5 app-container">
        <header class="text-center mb-5">
            <h1 class="display-5 fw-bold text-primary">AegisToolkit Web</h1>
            <p class="text-info">Interactive dashboard for secure file operations and string integrity mapping</p>
        </header>

        <div class="card shadow-sm mb-4">
            <div class="card-body p-4">
                <h2 class="h4 border-bottom border-secondary pb-2 mb-4 text-info">1. File Encryption (AES)</h2>
                
                <div class="mb-3">
                    <label for="encryptFile" class="form-label text-secondary fw-semibold">Select Target File:</label>
                    <input type="file" class="form-control crypto-input" id="encryptFile">
                </div>
                
                <div class="mb-4">
                    <label for="encryptPassword" class="form-label text-secondary fw-semibold">Set Encryption Password / Key:</label>
                    <input type="password" class="form-control crypto-input" id="encryptPassword" placeholder="Enter a secure password">
                </div>
                
                <button class="btn btn-primary w-100 fw-bold py-2" onclick="handleEncryption()">Encrypt & Save File</button>
                
                <div id="encryptStatus" class="output-box p-3 mt-3 rounded output-encrypt"></div>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body p-4">
                <h2 class="h4 border-bottom border-secondary pb-2 mb-4 text-warning">2. File Decryption</h2>
                
                <div class="mb-3">
                    <label for="decryptFile" class="form-label text-secondary fw-semibold">Select Encrypted File:</label>
                    <input type="file" class="form-control crypto-input" id="decryptFile">
                </div>
                
                <div class="mb-4">
                    <label for="decryptPassword" class="form-label text-secondary fw-semibold">Enter Password / Key:</label>
                    <input type="password" class="form-control crypto-input" id="decryptPassword" placeholder="Enter matching password">
                </div>
                
                <button class="btn btn-secondary w-100 fw-bold py-2" onclick="handleDecryption()">Decrypt & Restore File</button>
                
                <div id="decryptStatus" class="output-box p-3 mt-3 rounded output-decrypt"></div>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body p-4">
                <h2 class="h4 border-bottom border-secondary pb-2 mb-4 text-success">3. Hash Generation (Text Input)</h2>
                
                <div class="mb-3">
                    <label for="hashText" class="form-label text-secondary fw-semibold">Enter or Paste Text:</label>
                    <textarea class="form-control crypto-input" id="hashText" rows="4" placeholder="Type the string data you want to hash here..."></textarea>
                </div>
                
                <div class="mb-4">
                    <label for="hashAlgo" class="form-label text-secondary fw-semibold">Select Hashing Mode:</label>
                    <select class="form-select crypto-input" id="hashAlgo">
                        <option value="SHA-256">SHA-256 (Recommended)</option>
                        <option value="SHA-512">SHA-512</option>
                        <option value="MD5">MD5 (Legacy Contexts)</option>
                        <option value="SHA-1">SHA-1 (Legacy Contexts)</option>
                    </select>
                </div>
                
                <button class="btn btn-success w-100 fw-bold py-2" onclick="handleHashGeneration()">Generate Hash Signature</button>
                
                <div id="hashStatus" class="output-box p-3 mt-3 rounded output-hash"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <script src="tools/encrypt.js"></script>
    <script src="tools/decrypt.js"></script>
    <script src="tools/hash.js"></script>
    <script src="main.js"></script>

</body>
</html>
